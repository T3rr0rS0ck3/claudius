name: Release

on:
  push:
    tags: ['v*']
  # Manual (re)run for an existing tag: Actions → Release → Run workflow
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.1.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = '${{ env.TAG }}'.TrimStart('v')
          if ($version -notmatch '^(\d+)\.(\d+)\.(\d+)') { throw "Tag '${{ env.TAG }}' is not like v1.2.3" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "numeric=$($Matches[1]).$($Matches[2]).$($Matches[3]).0" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Build (self-contained)
        shell: pwsh
        run: ./build.ps1 -Version ${{ steps.version.outputs.version }} -SelfContained

      # Code signing via SignPath Foundation, active once the repository variable SIGNPATH_ORGANIZATION_ID is set.
      # Each signing request waits for manual approval in SignPath.
      - name: Upload unsigned app
        id: unsigned-app
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-app
          path: dist/Claudius
          if-no-files-found: error

      - name: Sign app
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: claudius
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/Claudius

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/Claudius/* -DestinationPath dist/Claudius-${{ steps.version.outputs.version }}-portable.zip

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $iscc /DAppVersion=${{ steps.version.outputs.version }} /DNumericVersion=${{ steps.version.outputs.numeric }} installer/Claudius.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload unsigned installer
        id: unsigned-setup
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-setup
          path: dist/Claudius-Setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

      - name: Sign installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: claudius
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist

      # Versions from before the rename to Claudius look for the setup under its old name.
      - name: Setup for older versions
        shell: pwsh
        run: Copy-Item dist/Claudius-Setup-${{ steps.version.outputs.version }}.exe dist/ClaudePet-Setup-${{ steps.version.outputs.version }}.exe

      # The in-app updater checks the downloaded setup against this file.
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/Claudius-Setup-*.exe, dist/ClaudePet-Setup-*.exe, dist/Claudius-*-portable.zip |
            ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Claudius - KI Usage Pet ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          body: |
            **Installation:** `Claudius-Setup-${{ steps.version.outputs.version }}.exe` herunterladen und ausführen (keine Admin-Rechte, kein .NET nötig).
            Im Setup kann Claudius direkt als statusLine im KI-Assistenten eingetragen werden.

            Alternativ: `Claudius-${{ steps.version.outputs.version }}-portable.zip` entpacken und `Claudius.exe` starten.

            [Code signing policy](https://github.com/T3rr0rS0ck3/claudius#code-signing-policy)
          files: |
            dist/Claudius-Setup-${{ steps.version.outputs.version }}.exe
            dist/ClaudePet-Setup-${{ steps.version.outputs.version }}.exe
            dist/Claudius-${{ steps.version.outputs.version }}-portable.zip
            dist/SHA256SUMS.txt

